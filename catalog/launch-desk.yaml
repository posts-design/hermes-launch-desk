known_issues:
  - "To use your posts.design account: hermes mcp add posts --url https://posts.design/mcp --auth oauth, then hermes config set plugins.entries.launch-desk.mcp_allowlist '[\"posts\"]', then hermes mcp login posts. Without it a bundled sample pack is used."
