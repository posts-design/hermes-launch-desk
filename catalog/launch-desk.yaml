name: launch-desk
title: Launch Desk
repo: https://github.com/posts-design/hermes-launch-desk
sha: REPLACE_WITH_SHA
subdir: ""
description: "Tell it what you just shipped and /launch drafts a post for X from three real launch posts that worked, checks it in code, and composes a share card from your own screenshots, colours and logo. You approve a preview first, then get the text, the card and a link that opens X with the post filled in. Disclosure — one posts.design search per run through your own posts MCP server, a fetch of your product site, brand kit and packs stored locally, two check-ins scheduled only if you say Yes, and nothing is ever posted; see the README for the full list."
maintainer: posts-design
tier: community
category: tools
requires_hermes: ">=0.22.6"
docs_url: https://github.com/posts-design/hermes-launch-desk/blob/REPLACE_WITH_SHA/README.md
version: "0.1.0"
image: https://raw.githubusercontent.com/posts-design/hermes-launch-desk/REPLACE_WITH_SHA/assets/banner.png
screenshots:
  - https://raw.githubusercontent.com/posts-design/hermes-launch-desk/REPLACE_WITH_SHA/assets/screenshots/card-x.png
  - https://raw.githubusercontent.com/posts-design/hermes-launch-desk/REPLACE_WITH_SHA/assets/screenshots/card-statement.png
  - https://raw.githubusercontent.com/posts-design/hermes-launch-desk/REPLACE_WITH_SHA/assets/screenshots/card-split.png
  - https://raw.githubusercontent.com/posts-design/hermes-launch-desk/REPLACE_WITH_SHA/assets/screenshots/feed-preview.png
  - https://raw.githubusercontent.com/posts-design/hermes-launch-desk/REPLACE_WITH_SHA/assets/screenshots/telegram-album.png
  - https://raw.githubusercontent.com/posts-design/hermes-launch-desk/REPLACE_WITH_SHA/assets/screenshots/cli-flow.png
platforms: []
known_issues:
  - "To use your posts.design account: hermes mcp add posts --url https://posts.design/mcp --auth oauth, then hermes config set plugins.entries.launch-desk.mcp_allowlist '[\"posts\"]', then hermes mcp login posts. Without it a bundled sample pack is used."
capabilities:
  provides_tools: [launch_desk_attach_screenshot, launch_desk_followup, launch_desk_record_results]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
