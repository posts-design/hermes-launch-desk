name: launch-desk
title: Launch Desk
repo: https://github.com/posts-design/hermes-launch-desk
sha: REPLACE_WITH_SHA
subdir: ""
description: "Tell it what you just shipped and /launch builds a launch post pack for X: three real launch posts from posts.design (or the bundled sample pack when posts.design isn't set up) picked in code, a draft checked in code against a scroll test and against details you never gave, and a share card and feed preview composed from your own screenshot, colours and logo. You approve the preview in a second step and get the text, the card and a link that opens X with the post filled in; it never posts for you. Disclosure — posts.design is reached only through the user's own posts MCP server (OAuth sign-in; plugins.entries.launch-desk.mcp_allowlist must list it), with an access check (get_my_access) and one search per run, about one posts.design credit; the search sends the first 160 characters of what shipped, a short keyword phrase from it, a fixed phrase for the kind of launch and a category. The founder's detail after --, the site link, the draft, the brand kit and the screenshot are not sent to posts.design. Without the server it uses a bundled sample pack and says so. The configured model receives the brief (what shipped and the detail), the product name, tagline and link, the reference captions and any voice samples. The product site, its stylesheets and the logo it links to are fetched (at most 4 requests, each following up to 3 redirects). Stored locally in the plugin data folder and Hermes plugin state: the brand kit with any voice samples, a pending draft with its card, preview and search results (up to 24 hours, or until approve or discard), finished packs, and the path of an attached screenshot (the file is not copied); copies of the card and preview go to Hermes' image cache so chat apps can show them. Only if the founder says Yes after approve, two check-ins (a day and three days later) are created as ordinary Hermes cron jobs that post to the same chat; each sends the pack (post, unused hooks, detail, shapes of unshown references, recorded sign-ups) to the configured model, and sign-ups the founder reports are stored in the pack. Nothing is posted or sent to any social network; no telemetry."
maintainer: posts-design
tier: community
category: tools
