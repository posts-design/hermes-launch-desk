name: launch-desk
version: 0.1.0
description: >-
  Turns "I just shipped X" into a launch post pack: three hooks, a caption, a share card and a
  feed preview, checked against a scroll test. What you shipped (first 160 characters) is sent to
  posts.design as the search text, through your own account; your site is fetched (at most 4
  requests); the brand kit, voice samples, drafts and their search results are stored locally in the
  plugin data directory; nothing is posted. After approve, only if the founder says Yes, two check-ins
  (a day and three days later) are created on Hermes' own scheduler and post to the same chat;
  sign-ups the founder reports are stored in the pack. An optional Hermes Desktop page (its UI off
  until turned on) shows the packs; its read-only backend, served while the plugin is enabled, reads
  the packs and, from Hermes' cron/jobs.json, the times of the check-ins Launch Desk scheduled.
author: posts.design
license: MIT
homepage: https://github.com/posts-design/hermes-launch-desk
requires_hermes: ">=0.22.6"
provides_tools:
  - launch_desk_attach_screenshot
  - launch_desk_followup
  - launch_desk_record_results
