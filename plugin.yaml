name: launch-desk
version: 0.1.0
description: >-
  Turns "I just shipped X" into a launch post pack: three hooks, a caption, a share card and a
  feed preview, checked against a scroll test. The posts.design MCP calls use your own posts.design
  account; the product site is fetched; the brand kit and drafts are stored locally in the plugin
  data directory; nothing is posted.
author: posts.design
license: MIT
homepage: https://github.com/posts-design/hermes-launch-desk
requires_hermes: ">=0.22.6"
provides_tools:
  - launch_desk_attach_screenshot
